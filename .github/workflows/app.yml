# Revisa el código y arma el APK de Android en cada cambio.
# El APK queda publicado en Releases como "ultima-version" para bajarlo directo.
name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # para publicar el APK como descarga directa

jobs:
  revisar-y-armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Armar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: donde-esta-mi-camion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # Descarga directa (también desde el celular):
      # https://github.com/<dueño>/<repo>/releases/download/ultima-version/donde-esta-mi-camion.apk
      - name: Publicar APK para descargar
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk donde-esta-mi-camion.apk
          gh release delete ultima-version --cleanup-tag --yes || true
          gh release create ultima-version donde-esta-mi-camion.apk \
            --target "$SHA" --prerelease \
            --title "Última versión para probar" \
            --notes "APK armado automáticamente desde $SHA."
