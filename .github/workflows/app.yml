# Revisa el código y arma el APK de Android en cada cambio.
# El APK queda para descargar en la pestaña "Actions" de GitHub.
name: App

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  revisar-y-armar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Armar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: donde-esta-mi-camion-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
